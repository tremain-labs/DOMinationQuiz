<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/stylesheet.css">
    
</head>
<body>
    <div class="quiz-container">   <!-- Quiz container, shared by all questions and answers. -->
        <h1>JavaScript Quiz</h1>
        <div class="questions-container"></div>  <!-- Questions container, shared by all questions -->
        <div class="options-container"></div>     <!-- Options container, shared by all questions -->
        <button class="start-button">Start Quiz</button>
        <button class="next-button hidden">Next Question</button>  <!-- Next question button, shared by all questions -->
    </div>
    <div class="score-container hidden">     <!-- Score container, hidden by default -->
        <h2>Your Score</h2>                 <!-- Score title -->
        <p class="score"></p>               <!-- Score display -->
        <button class="restart-button">Restart Quiz</button>  <!-- Restart quiz button, hidden by default -->
    </div>
    <script src="js/quiz.js"></script>   <!-- Quiz script -->
</body>
</html>
